<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Grade Tracker</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Baloo+2:wght@700;800&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --pink:   #ff6b9d;
      --orange: #ff9f43;
      --yellow: #ffd32a;
      --green:  #0be881;
      --blue:   #00d2ff;
      --purple: #a855f7;
      --bg:     #fff8f0;
      --card:   #ffffff;
      --text:   #2d1b69;
      --muted:  #9b8ec4;
      --radius: 20px;
    }

    body {
      background: var(--bg);
      font-family: 'Nunito', sans-serif;
      color: var(--text);
      min-height: 100vh;
    }

    /* Confetti background */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        radial-gradient(circle at 10% 20%, rgba(255,107,157,0.12) 0%, transparent 40%),
        radial-gradient(circle at 90% 10%, rgba(0,210,255,0.12) 0%, transparent 40%),
        radial-gradient(circle at 50% 90%, rgba(168,85,247,0.10) 0%, transparent 40%),
        radial-gradient(circle at 80% 60%, rgba(255,159,67,0.10) 0%, transparent 40%);
      pointer-events: none;
      z-index: 0;
    }

    .wrap {
      max-width: 900px;
      margin: 0 auto;
      padding: 40px 20px 80px;
      position: relative;
      z-index: 1;
    }

    /* Header */
    header {
      text-align: center;
      margin-bottom: 40px;
      animation: popIn 0.5s cubic-bezier(0.34,1.56,0.64,1) both;
    }

    .logo {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      background: linear-gradient(135deg, var(--pink), var(--purple));
      color: white;
      padding: 10px 24px;
      border-radius: 50px;
      font-size: 0.85rem;
      font-weight: 800;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      margin-bottom: 16px;
    }

    h1 {
      font-family: 'Baloo 2', cursive;
      font-size: clamp(2.2rem, 6vw, 3.5rem);
      font-weight: 800;
      background: linear-gradient(135deg, var(--pink) 0%, var(--purple) 50%, var(--blue) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      line-height: 1.1;
    }

    .tagline {
      color: var(--muted);
      font-size: 1rem;
      margin-top: 8px;
      font-weight: 600;
    }

    /* Stats row */
    .stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 14px;
      margin-bottom: 32px;
      animation: fadeUp 0.5s 0.1s ease both;
    }

    @media (max-width: 600px) { .stats { grid-template-columns: repeat(2,1fr); } }

    .stat-card {
      background: var(--card);
      border-radius: var(--radius);
      padding: 18px 14px;
      text-align: center;
      box-shadow: 0 4px 20px rgba(0,0,0,0.07);
      border-top: 4px solid transparent;
      transition: transform 0.2s;
    }

    .stat-card:hover { transform: translateY(-3px); }
    .stat-card:nth-child(1) { border-color: var(--pink); }
    .stat-card:nth-child(2) { border-color: var(--green); }
    .stat-card:nth-child(3) { border-color: var(--blue); }
    .stat-card:nth-child(4) { border-color: var(--orange); }

    .stat-num {
      font-family: 'Baloo 2', cursive;
      font-size: 2rem;
      font-weight: 800;
      line-height: 1;
    }

    .stat-card:nth-child(1) .stat-num { color: var(--pink); }
    .stat-card:nth-child(2) .stat-num { color: var(--green); }
    .stat-card:nth-child(3) .stat-num { color: var(--blue); }
    .stat-card:nth-child(4) .stat-num { color: var(--orange); }

    .stat-label {
      font-size: 0.75rem;
      color: var(--muted);
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-top: 4px;
    }

    /* Add student form */
    .form-card {
      background: var(--card);
      border-radius: var(--radius);
      padding: 24px;
      margin-bottom: 28px;
      box-shadow: 0 4px 24px rgba(168,85,247,0.10);
      border: 2px dashed rgba(168,85,247,0.25);
      animation: fadeUp 0.5s 0.2s ease both;
    }

    .form-title {
      font-family: 'Baloo 2', cursive;
      font-size: 1.2rem;
      font-weight: 700;
      color: var(--purple);
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .form-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 12px;
    }

    input[type="text"], input[type="number"] {
      font-family: 'Nunito', sans-serif;
      font-size: 0.95rem;
      font-weight: 600;
      padding: 10px 16px;
      border-radius: 12px;
      border: 2px solid #e8e0f5;
      background: #faf8ff;
      color: var(--text);
      outline: none;
      transition: border-color 0.2s;
    }

    input[type="text"]:focus, input[type="number"]:focus {
      border-color: var(--purple);
    }

    input[type="text"]::placeholder, input[type="number"]::placeholder { color: var(--muted); }

    .name-input { flex: 1; min-width: 180px; }

    .subjects-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      margin-bottom: 14px;
    }

    @media (max-width: 600px) { .subjects-grid { grid-template-columns: repeat(2,1fr); } }

    .subject-field { display: flex; flex-direction: column; gap: 4px; }
    .subject-label { font-size: 0.75rem; font-weight: 800; color: var(--muted); text-transform: uppercase; letter-spacing: 0.07em; }

    .subject-field:nth-child(1) .subject-label { color: var(--pink); }
    .subject-field:nth-child(2) .subject-label { color: var(--blue); }
    .subject-field:nth-child(3) .subject-label { color: var(--green); }
    .subject-field:nth-child(4) .subject-label { color: var(--orange); }

    .btn {
      font-family: 'Nunito', sans-serif;
      font-weight: 800;
      font-size: 0.9rem;
      padding: 11px 24px;
      border-radius: 50px;
      border: none;
      cursor: pointer;
      transition: all 0.2s;
      letter-spacing: 0.03em;
    }

    .btn-add {
      background: linear-gradient(135deg, var(--purple), var(--pink));
      color: white;
      box-shadow: 0 4px 15px rgba(168,85,247,0.35);
    }

    .btn-add:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(168,85,247,0.45); }

    .btn-delete {
      background: #fff0f3;
      color: var(--pink);
      border: 2px solid #ffd6e3;
      padding: 6px 14px;
      font-size: 0.8rem;
    }

    .btn-delete:hover { background: var(--pink); color: white; }

    /* Student cards */
    .students-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
      gap: 18px;
      animation: fadeUp 0.5s 0.3s ease both;
    }

    @media (max-width: 500px) { .students-grid { grid-template-columns: 1fr; } }

    .student-card {
      background: var(--card);
      border-radius: var(--radius);
      padding: 22px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.07);
      transition: transform 0.2s, box-shadow 0.2s;
      animation: popIn 0.4s cubic-bezier(0.34,1.56,0.64,1) both;
      position: relative;
      overflow: hidden;
    }

    .student-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 5px;
    }

    .student-card:hover { transform: translateY(-4px); box-shadow: 0 10px 30px rgba(0,0,0,0.12); }

    /* Grade-based accent colors */
    .grade-aplus::before { background: linear-gradient(90deg, var(--green), var(--blue)); }
    .grade-a::before     { background: linear-gradient(90deg, var(--blue), var(--purple)); }
    .grade-b::before     { background: linear-gradient(90deg, var(--purple), var(--pink)); }
    .grade-c::before     { background: linear-gradient(90deg, var(--orange), var(--yellow)); }
    .grade-d::before     { background: linear-gradient(90deg, var(--orange), var(--pink)); }
    .grade-f::before     { background: linear-gradient(90deg, var(--pink), #ff0000); }

    .card-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }

    .student-avatar {
      width: 46px; height: 46px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-family: 'Baloo 2', cursive;
      font-size: 1.3rem;
      font-weight: 800;
      color: white;
      flex-shrink: 0;
    }

    .student-info { flex: 1; margin-left: 12px; }

    .student-name {
      font-family: 'Baloo 2', cursive;
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--text);
      line-height: 1.2;
    }

    .student-id {
      font-size: 0.72rem;
      color: var(--muted);
      font-weight: 700;
    }

    .grade-badge {
      font-family: 'Baloo 2', cursive;
      font-size: 1.5rem;
      font-weight: 800;
      width: 52px; height: 52px;
      border-radius: 14px;
      display: flex; align-items: center; justify-content: center;
      color: white;
      flex-shrink: 0;
    }

    .grade-aplus .grade-badge { background: linear-gradient(135deg, var(--green), var(--blue)); }
    .grade-a .grade-badge     { background: linear-gradient(135deg, var(--blue), var(--purple)); }
    .grade-b .grade-badge     { background: linear-gradient(135deg, var(--purple), var(--pink)); }
    .grade-c .grade-badge     { background: linear-gradient(135deg, var(--orange), var(--yellow)); }
    .grade-d .grade-badge     { background: linear-gradient(135deg, var(--orange), var(--pink)); }
    .grade-f .grade-badge     { background: linear-gradient(135deg, var(--pink), #ff0000); }

    /* Subjects */
    .subjects {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      margin-bottom: 14px;
    }

    .subject-row {
      background: #faf8ff;
      border-radius: 10px;
      padding: 8px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .subject-name {
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--muted);
    }

    .subject-mark {
      font-family: 'Baloo 2', cursive;
      font-size: 1rem;
      font-weight: 800;
      color: var(--text);
    }

    /* Progress bar */
    .avg-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
    }

    .avg-label { font-size: 0.78rem; font-weight: 800; color: var(--muted); white-space: nowrap; }
    .avg-value { font-family: 'Baloo 2', cursive; font-size: 1rem; font-weight: 800; color: var(--text); white-space: nowrap; }

    .progress-bar {
      flex: 1;
      height: 8px;
      background: #f0ebff;
      border-radius: 50px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      border-radius: 50px;
      transition: width 0.8s cubic-bezier(0.34,1.56,0.64,1);
    }

    .grade-aplus .progress-fill { background: linear-gradient(90deg, var(--green), var(--blue)); }
    .grade-a .progress-fill     { background: linear-gradient(90deg, var(--blue), var(--purple)); }
    .grade-b .progress-fill     { background: linear-gradient(90deg, var(--purple), var(--pink)); }
    .grade-c .progress-fill     { background: linear-gradient(90deg, var(--orange), var(--yellow)); }
    .grade-d .progress-fill, .grade-f .progress-fill { background: linear-gradient(90deg, var(--pink), var(--orange)); }

    .card-footer { display: flex; justify-content: flex-end; }

    /* Empty / loading */
    .center-msg {
      text-align: center;
      padding: 60px 20px;
      color: var(--muted);
      font-size: 1rem;
      font-weight: 700;
      grid-column: 1/-1;
    }

    .big-emoji { font-size: 3rem; display: block; margin-bottom: 12px; }

    .spinner {
      width: 36px; height: 36px;
      border: 3px solid #e8e0f5;
      border-top-color: var(--purple);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      margin: 0 auto 12px;
    }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 24px; right: 24px;
      background: white;
      border-radius: 14px;
      padding: 14px 20px;
      font-weight: 700;
      font-size: 0.9rem;
      color: var(--text);
      box-shadow: 0 8px 30px rgba(0,0,0,0.15);
      border-left: 4px solid var(--green);
      z-index: 999;
      transform: translateY(80px);
      opacity: 0;
      transition: all 0.3s cubic-bezier(0.34,1.56,0.64,1);
    }
    .toast.show { transform: translateY(0); opacity: 1; }

    @keyframes popIn {
      from { opacity: 0; transform: scale(0.85); }
      to   { opacity: 1; transform: scale(1); }
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="logo">🎓 Grade Tracker</div>
    <h1>Student Performance Dashboard</h1>
    <p class="tagline">Track grades, celebrate wins, spot who needs help!</p>
  </header>

  <div class="stats">
    <div class="stat-card">
      <div class="stat-num" id="statTotal">–</div>
      <div class="stat-label">Students</div>
    </div>
    <div class="stat-card">
      <div class="stat-num" id="statToppers">–</div>
      <div class="stat-label">A+ Toppers</div>
    </div>
    <div class="stat-card">
      <div class="stat-num" id="statAvg">–</div>
      <div class="stat-label">Class Avg</div>
    </div>
    <div class="stat-card">
      <div class="stat-num" id="statNeedHelp">–</div>
      <div class="stat-label">Need Help</div>
    </div>
  </div>

  <!-- Add Student Form -->
  <div class="form-card">
    <div class="form-title">➕ Add New Student</div>
    <div class="form-row">
      <input class="name-input" type="text" id="studentName" placeholder="Student name…"/>
    </div>
    <div class="subjects-grid">
      <div class="subject-field">
        <span class="subject-label">Maths</span>
        <input type="number" id="sub1" placeholder="0–100" min="0" max="100"/>
      </div>
      <div class="subject-field">
        <span class="subject-label">Science</span>
        <input type="number" id="sub2" placeholder="0–100" min="0" max="100"/>
      </div>
      <div class="subject-field">
        <span class="subject-label">English</span>
        <input type="number" id="sub3" placeholder="0–100" min="0" max="100"/>
      </div>
      <div class="subject-field">
        <span class="subject-label">History</span>
        <input type="number" id="sub4" placeholder="0–100" min="0" max="100"/>
      </div>
    </div>
    <button class="btn btn-add" onclick="addStudent()">🚀 Add Student</button>
  </div>

  <!-- Student Cards -->
  <div class="students-grid" id="studentGrid">
    <div class="center-msg"><div class="spinner"></div>Loading students…</div>
  </div>

</div>

<div class="toast" id="toast"></div>

<script>
  const API = '/api/students';
  const SUBJECTS = ['Maths','Science','English','History'];
  const COLORS = ['#ff6b9d','#a855f7','#00d2ff','#ff9f43','#0be881','#ff6b6b'];

  const gradeClass = g => ({'A+':'grade-aplus','A':'grade-a','B':'grade-b','C':'grade-c','D':'grade-d','F':'grade-f'}[g]||'grade-f');

  function initials(name) {
    return name.split(' ').map(w=>w[0]).join('').toUpperCase().slice(0,2);
  }

  function avatarColor(name) {
    let h = 0; for (let c of name) h = (h*31 + c.charCodeAt(0)) % COLORS.length;
    return COLORS[h];
  }

  async function loadStudents() {
    try {
      const res = await fetch(API);
      const students = await res.json();
      render(students);
      updateStats(students);
    } catch {
      document.getElementById('studentGrid').innerHTML =
        `<div class="center-msg"><span class="big-emoji">⚠️</span>Cannot connect to API.<br>Make sure Spring Boot is running.</div>`;
    }
  }

  function avg(subjects) {
    if (!subjects?.length) return 0;
    return subjects.reduce((s,sub)=>s+sub.marks,0)/subjects.length;
  }

  function grade(subjects) {
    const a = avg(subjects);
    if (a>=90) return 'A+'; if (a>=80) return 'A'; if (a>=70) return 'B';
    if (a>=60) return 'C'; if (a>=50) return 'D'; return 'F';
  }

  function updateStats(students) {
    const total = students.length;
    const toppers = students.filter(s => grade(s.subjects) === 'A+').length;
    const classAvg = total ? (students.reduce((s,st)=>s+avg(st.subjects),0)/total).toFixed(1) : '–';
    const needHelp = students.filter(s => avg(s.subjects) < 60).length;
    document.getElementById('statTotal').textContent    = total;
    document.getElementById('statToppers').textContent  = toppers;
    document.getElementById('statAvg').textContent      = classAvg;
    document.getElementById('statNeedHelp').textContent = needHelp;
  }

  function render(students) {
    const grid = document.getElementById('studentGrid');
    if (!students.length) {
      grid.innerHTML = `<div class="center-msg"><span class="big-emoji">📭</span>No students yet. Add one above!</div>`;
      return;
    }
    grid.innerHTML = students.map((s, i) => {
      const g = grade(s.subjects);
      const gc = gradeClass(g);
      const a = avg(s.subjects).toFixed(1);
      const color = avatarColor(s.name);
      const subjectsHtml = (s.subjects||[]).map(sub=>`
        <div class="subject-row">
          <span class="subject-name">${sub.name}</span>
          <span class="subject-mark">${sub.marks}</span>
        </div>`).join('');

      return `
      <div class="student-card ${gc}" style="animation-delay:${i*0.07}s">
        <div class="card-top">
          <div class="student-avatar" style="background:${color}">${initials(s.name)}</div>
          <div class="student-info">
            <div class="student-name">${s.name}</div>
            <div class="student-id">ID #${s.id}</div>
          </div>
          <div class="grade-badge">${g}</div>
        </div>
        <div class="subjects">${subjectsHtml}</div>
        <div class="avg-row">
          <span class="avg-label">AVG</span>
          <div class="progress-bar"><div class="progress-fill" style="width:${a}%"></div></div>
          <span class="avg-value">${a}%</span>
        </div>
        <div class="card-footer">
          <button class="btn btn-delete" onclick="deleteStudent(${s.id})">🗑 Remove</button>
        </div>
      </div>`;
    }).join('');
  }

  async function addStudent() {
    const name = document.getElementById('studentName').value.trim();
    const marks = ['sub1','sub2','sub3','sub4'].map(id => parseFloat(document.getElementById(id).value));
    if (!name) { showToast('⚠️ Please enter a name!'); return; }
    if (marks.some(isNaN)) { showToast('⚠️ Fill in all subject marks!'); return; }
    if (marks.some(m => m<0||m>100)) { showToast('⚠️ Marks must be 0–100!'); return; }

    const student = { name, subjects: SUBJECTS.map((s,i)=>({name:s, marks:marks[i]})) };
    try {
      await fetch(API, { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(student) });
      document.getElementById('studentName').value = '';
      ['sub1','sub2','sub3','sub4'].forEach(id => document.getElementById(id).value = '');
      showToast('🎉 Student added!');
      loadStudents();
    } catch { showToast('❌ Failed to add student.'); }
  }

  async function deleteStudent(id) {
    try {
      await fetch(`${API}/${id}`, { method:'DELETE' });
      showToast('🗑 Student removed.');
      loadStudents();
    } catch { showToast('❌ Failed to delete.'); }
  }

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(()=>t.classList.remove('show'), 2800);
  }

  loadStudents();
</script>
</body>
</html>
